<script>
const lessons=JSON.parse(document.getElementById('lesson-data').textContent);
const dialog=document.getElementById('lesson');let current=0;
const esc=s=>s.replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
document.getElementById('cards').innerHTML=lessons.map((c,i)=>`<button class="card" data-lesson="${i}" aria-haspopup="dialog"><span class="num">${String(i+1).padStart(2,'0')} ／ ${esc(c.time)} 分</span><h3>${esc(c.title)}</h3><p>${esc(c.lead)}</p><span class="foot">${esc(c.tag)} ↗</span></button>`).join('');
function showLesson(i){current=i;const c=lessons[i];document.getElementById('lesson-title').textContent=c.title;document.getElementById('lesson-time').textContent=`第 ${i+1} 段 · ${c.time} 分 · ${c.tag}`;document.getElementById('lesson-body').innerHTML=`<h3>這一段要學會</h3><p>${esc(c.goal)}</p><ul>${c.points.map(p=>`<li>${esc(p)}</li>`).join('')}</ul><h3>示範與練習</h3><p>${esc(c.demo)}</p><h3>可貼給 agent 的提示詞</h3><pre>${esc(c.prompt)}</pre><h3>應得到的產物</h3><p>${esc(c.output)}</p><p class="note"><strong>停止條件：</strong>${esc(c.stop)}</p><details><summary>課堂提問：${esc(c.question)}</summary><p>${esc(c.answer)}</p></details><details><summary>講者節奏與提示</summary><ul>${c.notes.map(p=>`<li>${esc(p)}</li>`).join('')}</ul></details><p class="small">來源快照：${c.sources.map(s=>`<a href="course/sources/${esc(s)}" target="_blank" rel="noopener">${esc(s)}</a>`).join(' · ')}；論文與線上來源見來源索引。</p><div class="dialog-bottom"><button class="btn" id="previous" ${i===0?'disabled':''}>← 上一段</button><button class="btn primary" id="next" ${i===lessons.length-1?'disabled':''}>下一段 →</button></div>`;document.getElementById('previous').onclick=()=>showLesson(i-1);document.getElementById('next').onclick=()=>showLesson(i+1);if(!dialog.open)dialog.showModal();dialog.scrollTop=0;document.getElementById('close').focus();}
document.getElementById('cards').onclick=e=>{const b=e.target.closest('[data-lesson]');if(b)showLesson(Number(b.dataset.lesson));};document.getElementById('start').onclick=()=>showLesson(0);document.getElementById('close').onclick=()=>dialog.close();
</script></body></html>
