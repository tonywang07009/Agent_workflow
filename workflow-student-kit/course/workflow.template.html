<!doctype html>
<html lang="zh-Hant">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Workflow｜從問題到品質演進</title>
<style>
:root{color-scheme:light;--bg:#f4f3ed;--ink:#183831;--muted:#576d65;--line:#c7d5cd;--paper:#fff;--accent:#17695b;--warm:#9a4b28}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:system-ui,"Noto Sans TC",sans-serif;line-height:1.6}
main{max-width:1280px;margin:auto;padding:34px 36px}header{display:flex;justify-content:space-between;align-items:flex-start;gap:24px;border-bottom:1px solid var(--line);padding-bottom:20px}
h1{font-size:clamp(27px,3.6vw,46px);line-height:1.2;margin:8px 0 12px;letter-spacing:-.04em}h2{font-size:17px;margin:0 0 12px}p{margin:8px 0}.eyebrow{font-size:12px;letter-spacing:.14em;font-weight:800;color:var(--accent)}.intro{max-width:720px;color:var(--muted);font-size:14px}.badge{background:#dfebe4;padding:7px 12px;border-radius:24px;white-space:nowrap;font-size:12px}
.lane{margin-top:22px}.lane-title{display:flex;align-items:center;gap:12px}.lane-title span{font-size:12px;color:var(--muted);font-weight:400}
.nodes{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:25px}.nodes.four{grid-template-columns:repeat(4,minmax(0,1fr))}
.node{position:relative;font:inherit;background:var(--paper);text-align:left;padding:16px 18px;border:1px solid var(--line);border-radius:10px;color:var(--ink);cursor:pointer;min-height:107px}
.node:not(:last-child)::after{content:"→";position:absolute;right:-21px;top:38%;font-size:19px;color:var(--muted)}
.node strong{display:block;font-size:17px;margin:4px 0}.node small{display:block;font-size:12px;color:var(--muted)}.node .step{font:11px ui-monospace,monospace;color:var(--accent)}
.node[aria-pressed=true]{border:2px solid var(--accent);padding:15px 17px;background:#edf5ef}.node:hover{background:#edf5ef}
.connector{margin:9px 0 0;text-align:right;font-size:12px;color:var(--muted)}.knowledge .node{border-top:3px solid #a96c42}
.detail{display:grid;grid-template-columns:1fr 2fr;gap:24px;padding:20px 24px;background:var(--paper);border:1px solid var(--line);border-radius:10px;margin-top:22px}
.detail h2{font-size:20px}.detail p{font-size:14px}.detail ul{padding-left:20px;margin:0;font-size:14px}.detail li{margin:5px 0}
.modes{margin-top:20px;padding-top:16px;border-top:1px solid var(--line);font-size:13px}.switch{display:flex;gap:8px;flex-wrap:wrap;margin:9px 0}
.switch button{font:inherit;padding:7px 12px;border:1px solid var(--line);border-radius:6px;background:var(--paper);color:var(--ink);cursor:pointer}
.switch button[aria-pressed=true]{background:var(--accent);color:white}.muted{color:var(--muted)}a{color:var(--accent)}
button:focus-visible,a:focus-visible{outline:3px solid var(--warm);outline-offset:3px}.foot{font-size:12px;margin-top:14px;color:var(--muted);display:flex;gap:16px;flex-wrap:wrap}
@media(max-width:720px){main{padding:22px 18px}.nodes,.nodes.four{grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.node::after{display:none}header{display:block}.badge{display:inline-block;margin-top:8px}.detail{grid-template-columns:1fr;gap:8px;padding:16px}.lane-title{display:block}.lane-title span{display:block}.connector{text-align:left}}
@media(max-width:390px){.nodes,.nodes.four{grid-template-columns:1fr}.node{min-height:85px}}
@media(prefers-color-scheme:dark){:root{color-scheme:dark;--bg:#132720;--ink:#e0eee5;--muted:#a6beb1;--line:#3c574a;--paper:#1c3328;--accent:#92d6b6;--warm:#ecc091}.badge,.node:hover,.node[aria-pressed=true]{background:#294738}.switch button[aria-pressed=true]{color:#14261d}}
</style></head>
<body><main>
<header><div><span class="eyebrow">WORKFLOW / STUDENT KIT</span><h1>從問題拆解，到品質演進</h1><p class="intro">以 <code>$workflow</code> 啟動或續接。依專案選工具，完成一個 change 再停下；整個大專案結案後，才進入可選的知識整理。</p></div><span class="badge">14 個 Skills · 可離線閱讀</span></header>
<div id="lanes" aria-label="系統流程圖"></div>
<section class="detail" aria-live="polite" aria-atomic="true"><div><span class="eyebrow" id="detail-owner"></span><h2 id="detail-title"></h2><p id="detail-output" class="muted"></p></div><ul id="detail-points"></ul></section>
<section class="modes" aria-label="停點模式教學"><strong>停點模式示意</strong><div class="switch"><button data-mode="change" aria-pressed="true">每個 change 停下</button><button data-mode="auto" aria-pressed="false">自動接續 changes</button></div><p id="mode-text" aria-live="polite"></p><p class="muted">同一台電腦的同一使用者，跨專案完成 5 次完整 workflow 後詢問切換；拒絕後不再主動重問，仍可隨時自行切換。此處僅示範，不修改實際設定。</p></section>
<nav class="foot"><a href="../docs/tools.md" target="_parent">工具能力指南</a><a href="../management/openspec-project/toolbox.md" target="_parent">專案 Toolbox 範本</a><a href="../skills/workflow/SKILL.md" target="_parent">Workflow Skill</a><span>點選節點查看責任、產出與停止條件。</span></nav>
<noscript><p>啟用 JavaScript 可查看互動流程；也可直接閱讀上方 Skill 與管理範本。</p></noscript>
</main>
<script id="workflow-data" type="application/json">__WORKFLOW_DATA__</script>
<script>
const flow=JSON.parse(document.getElementById('workflow-data').textContent);
const lanes=document.getElementById('lanes');
function detail(node){
 document.querySelectorAll('.node').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.node===node.id)));
 document.getElementById('detail-owner').textContent=node.owner;
 document.getElementById('detail-title').textContent=node.title;
 document.getElementById('detail-output').textContent=node.output;
 const list=document.getElementById('detail-points');list.replaceChildren();
 node.points.forEach(point=>{const li=document.createElement('li');li.textContent=point;list.append(li);});
}
flow.lanes.forEach(lane=>{
 const section=document.createElement('section');section.className='lane '+lane.id;
 const heading=document.createElement('h2');heading.className='lane-title';heading.textContent=lane.title;
 const sub=document.createElement('span');sub.textContent=lane.subtitle;heading.append(sub);section.append(heading);
 const row=document.createElement('div');row.className='nodes'+(lane.nodes.length===4?' four':'');
 lane.nodes.forEach(id=>{const node=flow.nodes.find(n=>n.id===id);const b=document.createElement('button');b.className='node';b.dataset.node=id;b.setAttribute('aria-pressed','false');
 const step=document.createElement('span');step.className='step';step.textContent=node.step;
 const title=document.createElement('strong');title.textContent=node.title;
 const desc=document.createElement('small');desc.textContent=node.subtitle;b.append(step,title,desc);b.onclick=()=>detail(node);row.append(b);});
 section.append(row);const note=document.createElement('p');note.className='connector';note.textContent=lane.connection;section.append(note);lanes.append(section);
});
function mode(value){document.querySelectorAll('[data-mode]').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.mode===value)));
 document.getElementById('mode-text').textContent=value==='change'?'目前示意：同一 change 內連續完成規格、實作、驗證與封存，之後等待使用者接續。':'目前示意：自動進入下一個已確認範圍的 change；未決策事項、額外授權或必要證據缺失時仍會停下。';}
document.querySelectorAll('[data-mode]').forEach(b=>b.onclick=()=>mode(b.dataset.mode));
detail(flow.nodes[0]);mode('change');
function reportHeight(){parent.postMessage({type:'workflow-height',height:Math.ceil(document.querySelector('main').getBoundingClientRect().height)},'*');}
new ResizeObserver(reportHeight).observe(document.querySelector('main'));reportHeight();
</script></body></html>
